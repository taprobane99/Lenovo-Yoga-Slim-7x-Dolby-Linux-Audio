context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Dolby Atmos - Movie (Balanced)"
            media.name       = "Dolby Atmos - Movie (Balanced)"
            filter.graph = {
                nodes = [
                    # --- PRE-SPLIT BASS EXCITER ---
                    {
                        type    = lv2
                        name    = bassex
                        plugin  = "https://chadmed.au/bankstown"
                        control = { "bypass" = 0, "amt" = 1.5, "sat_second" = 1.3, "sat_third" = 2.5, "blend" = 1.0, "ceil" = 200.0, "floor" = 20.0 }
                    }

                    # --- PRE-SPLIT LOUDNESS COMPENSATORS (MONO) ---
                    {
                        type    = lv2
                        name    = loud_comp_l
                        plugin  = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        control = { "enabled" = 1, "input" = 1.0, "fft" = 2 }
                    }
                    {
                        type    = lv2
                        name    = loud_comp_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        control = { "enabled" = 1, "input" = 1.0, "fft" = 2 }
                    }

                    # --- PRE-SPLIT CONVOLVERS ---
                    { type = builtin name = conv_l label = convolver config = { filename = "/usr/share/dolby-audio/Dolby-Movie-Balanced.irs" channel = 0 } }
                    { type = builtin name = conv_r label = convolver config = { filename = "/usr/share/dolby-audio/Dolby-Movie-Balanced.irs" channel = 1 } }

                    # --- PRE-SPLIT STEREO TOOLS (Widens image for cinematic feel) ---
                    {
                        type    = lv2
                        name    = stereo_tools
                        plugin  = "http://calf.sourceforge.net/plugins/StereoTools"
                        control = { 
                            "level_in" = 1.0, 
                            "level_out" = 1.0, 
                            "softclip" = 0, 
                            "mutel" = 0, 
                            "muter" = 0, 
                            "phasel" = 0, 
                            "phaser" = 0, 
                            "mode" = 0, 
                            "slev" = 1.0, 
                            "sbal" = 0.0, 
                            "mlev" = 1.0, 
                            "mpan" = 0.0, 
                            "stereo_base" = 0.3, 
                            "delay" = 0.0, 
                            "sc_level" = 1.0, 
                            "stereo_phase" = 0.0 
                        }
                    }

                    # --- PRE-SPLIT EQUALIZER (Boosts 2.5kHz Vocal Range) ---
                    {
                        type    = lv2
                        name    = equalizer
                        plugin  = "http://lsp-plug.in/plugins/lv2/para_equalizer_x16_stereo"
                        control = { 
                            "mode" = 0, 
                            "ft_0" = 1, 
                            "fm_0" = 0, 
                            "s_0"  = 0, 
                            "f_0"  = 2500.0, 
                            "g_0"  = 1.2416, 
                            "w_0"  = 4.0, 
                            "q_0"  = 0.7 
                        }
                    }

                    # --- PRE-SPLIT MULTIBAND COMPRESSORS ---
                    {
                        type    = lv2
                        name    = mbc0
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = { "mode" = 1, "cbe_1" = 1, "sf_1" = 469.0, "cbe_2" = 0, "cbe_3" = 0, "cbe_4" = 0, "cbe_5" = 0, "cbe_6" = 0, "cbe_7" = 0, "ce_0" = 1, "al_0" = 0.56234, "at_0" = 0.9, "rrl_0" = 0.0001, "rt_0" = 1.0, "cr_0" = 3.94, "kn_0" = 0.50119, "mk_0" = 1.2589, "scm_0" = 1, "ce_1" = 1, "al_1" = 0.60256, "at_1" = 0.8, "rrl_1" = 0.0001, "rt_1" = 0.9, "cr_1" = 4.0, "kn_1" = 0.50119, "mk_1" = 1.1885, "scm_1" = 1 }
                    }
                    {
                        type    = lv2
                        name    = mbc1
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = { "mode" = 1, "cbe_1" = 1, "sf_1" = 81.4, "cbe_2" = 1, "sf_2" = 181.6, "cbe_3" = 1, "sf_3" = 277.0, "cbe_4" = 1, "sf_4" = 392.2, "cbe_5" = 1, "sf_5" = 554.7, "cbe_6" = 1, "sf_6" = 744.1, "cbe_7" = 0, "ce_0" = 1, "al_0" = 0.49545, "at_0" = 1.0, "rrl_0" = 0.0001, "rt_0" = 50.0, "cr_0" = 100.0, "kn_0" = 0.59566, "mk_0" = 1.0, "scm_0" = 0, "sla_0" = 1.0, "ce_1" = 1, "al_1" = 0.35892, "at_1" = 1.0, "rrl_1" = 0.0001, "rt_1" = 50.0, "cr_1" = 100.0, "kn_1" = 0.59566, "mk_1" = 1.0, "scm_1" = 0, "sla_1" = 1.0, "ce_2" = 1, "al_2" = 0.26303, "at_2" = 1.0, "rrl_2" = 0.0001, "rt_2" = 50.0, "cr_2" = 100.0, "kn_2" = 0.59566, "mk_2" = 1.0, "scm_2" = 0, "sla_2" = 1.0, "ce_3" = 1, "al_3" = 0.29854, "at_3" = 1.0, "rrl_3" = 0.0001, "rt_3" = 50.0, "cr_3" = 100.0, "kn_3" = 0.59566, "mk_3" = 1.0, "scm_3" = 0, "sla_3" = 1.0, "ce_4" = 1, "al_4" = 0.40272, "at_4" = 1.0, "rrl_4" = 0.0001, "rt_4" = 50.0, "cr_4" = 100.0, "kn_4" = 0.59566, "mk_4" = 1.0, "scm_4" = 0, "sla_4" = 1.0, "ce_5" = 1, "al_5" = 0.47863, "at_5" = 1.0, "rrl_5" = 0.0001, "rt_5" = 50.0, "cr_5" = 100.0, "kn_5" = 0.59566, "mk_5" = 1.0, "scm_5" = 0, "sla_5" = 1.0, "ce_6" = 0, "ce_7" = 0 }
                    }
                    
                    # --- POST-SPLIT FRONT LIMITERS ---
                    {
                        type    = lv2
                        name    = limiter_f
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = { "mode" = 0, "ovs" = 0, "dith" = 0, "extsc" = 0, "lk" = 1.0, "at" = 1.0, "rt" = 5.0, "th" = 0.89125, "boost" = 0, "slink" = 100.0, "alr" = 0, "scp" = 1.0 }
                    }

                    # --- POST-SPLIT REAR LIMITERS ---
                    {
                        type    = lv2
                        name    = limiter_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = { "mode" = 0, "ovs" = 0, "dith" = 0, "extsc" = 0, "lk" = 1.0, "at" = 1.0, "rt" = 5.0, "th" = 0.89125, "boost" = 0, "slink" = 100.0, "alr" = 0, "scp" = 1.0 }
                    }
                ]
                
                links = [
                    # Pre-Split Stereo Chain
                    { output = "bassex:out_l"      input = "loud_comp_l:in" }
                    { output = "bassex:out_r"      input = "loud_comp_r:in" }
                    { output = "loud_comp_l:out"   input = "conv_l:In" }
                    { output = "loud_comp_r:out"   input = "conv_r:In" }
                    { output = "conv_l:Out"        input = "stereo_tools:in_l" }
                    { output = "conv_r:Out"        input = "stereo_tools:in_r" }
                    { output = "stereo_tools:out_l" input = "equalizer:in_l" }
                    { output = "stereo_tools:out_r" input = "equalizer:in_r" }
                    { output = "equalizer:out_l"   input = "mbc0:in_l" }
                    { output = "equalizer:out_r"   input = "mbc0:in_r" }
                    { output = "mbc0:out_l"        input = "mbc1:in_l" }
                    { output = "mbc0:out_r"        input = "mbc1:in_r" }
                    
                    # The Split (Stereo to 4-Channel Safety Limiters)
                    { output = "mbc1:out_l"        input = "limiter_f:in_l" }
                    { output = "mbc1:out_r"        input = "limiter_f:in_r" }
                    { output = "mbc1:out_l"        input = "limiter_r:in_l" }
                    { output = "mbc1:out_r"        input = "limiter_r:in_r" }
                ]

                inputs  = [ "bassex:in_l" "bassex:in_r" ]
                outputs = [ "limiter_f:out_l" "limiter_f:out_r" "limiter_r:out_l" "limiter_r:out_r" ]
                
                capture.volumes = [
                    {
                        control = "loud_comp_l:volume"
                        min = -47.5
                        max = 0.0
                        scale = "cubic"
                    }
                    {
                        control = "loud_comp_r:volume"
                        min = -47.5
                        max = 0.0
                        scale = "cubic"
                    }
                ]
            }
            
            capture.props = {
                node.name      = "effect_input.movie_balanced_4ch"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                device.api = dsp
                node.virtual = false
                priority.session = 850
                state.default-volume = 0.343
            }
            
            playback.props = {
                node.name      = "effect_output.movie_balanced_4ch"
                node.dont-fallback = true
                node.passive   = true
                audio.channels = 4
                audio.position = [ FL FR RL RR ]
            }
        }
    }
]
