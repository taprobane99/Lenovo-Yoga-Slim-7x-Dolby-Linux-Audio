context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Dolby Atmos - Movie"
            media.name       = "Dolby Atmos - Movie"
            filter.graph = {
                nodes = [
                    # --- 1. BASS EXCITER & HIGH PASS FILTER ---
                    {
                        type    = lv2
                        name    = bassex
                        plugin  = "https://chadmed.au/bankstown"
                        control = {
                            "bypass" = 0
                            "amt" = 1.2
                            "sat_second" = 1.5
                            "sat_third" = 2.5
                            "blend" = 1.0
                            "ceil" = 200.0
                            "floor" = 20.0
                            "final_hp" = 130.0
                        }
                    }
                    
                    # --- 2. LOUDNESS COMPENSATOR ---
                    {
                        type   = lv2
                        name   = ell
                        plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_stereo"
                        control = {
                            "input" = 1.0
                            "fft" = 2
                        }
                    }

                    # --- 3. CONVOLVER (FROM DOLBY TUNING) ---
                    {
                        type = builtin
                        name = conv_l
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Movie-Balanced.wav"
                            channel = 0
                        }
                    }
                    {
                        type = builtin
                        name = conv_r
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Movie-Balanced.wav"
                            channel = 1
                        }
                    }
                    
                    # --- 4. STEREO TOOLS (WIDENER) ---
		    {
                        type    = lv2
                        name    = stereo_tools
                        plugin  = "http://calf.sourceforge.net/plugins/StereoTools"
                        control = {
                            "stereo_base"  = 0.3
                        }
                    }

                    # --- 5. VOICE EQUALIZER ---
                    {
                        type    = lv2
                        name    = post_eq
                        plugin  = "http://lsp-plug.in/plugins/lv2/para_equalizer_x8_stereo"
                        control = {
                            "ft_0" = 1          # type: Bell (1)
                            "f_0"  = 2500.0     # frequency: 2500.0 Hz
                            "g_0"  = 1.24165    # gain: 1.88 dB 
                            "q_0"  = 0.7        # q: 0.7
                        }
                    }
                    
                    # --- 6. FAST GLOBAL COMPRESSOR ---
                    {
                        type    = lv2
                        name    = sbc
                        plugin  = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                        control = { 
                            "g_in"  = 0.3162 # -10dB
                            "al"    = 0.3162 # -10dB
                            "cr"    = 8     
                            "at"    = 5    
                            "rt"    = 50   
                            "kn"    = 0.5012 # -6dB
                        }
                    }

                    # --- 7. SLOW 4 BAND COMPRESSOR ---
                    {
                        type    = lv2
                        name    = mbc
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            # --- GLOBAL SETTINGS ---
                            "envb" = 0 # Envelope Boost: off
			    # --- SPLIT FREQUENCIES ---
                            "cbe_1" = 1 # Split Band 0 and 1
                            "sf_1" = 250.0 
                            "cbe_2" = 1 # Split Band 1 and 2
                            "sf_2" = 1250.0 
                            "cbe_3" = 1 # Split Band 2 and 3
                            "sf_3" = 5000.0 
                            
                            # --- Band 1 (0Hz - 250Hz) ---
                            "ce_0" = 1 
                            "al_0" = 0.15849 # Attack thresh (-16.00 dB)
                            "cr_0" = 3.0     # Ratio
                            "at_0" = 150.0   # Attack time (ms)
                            "rt_0" = 3000.0  # Release time (ms)
                            "kn_0" = 0.25119 # Knee (-12.00 dB)
                            "mk_0" = 1.58489 # Makeup Gain (4.00 dB) was 3dB
                            
                            # --- Band 2 (250Hz - 1250Hz) ---
                            "ce_1" = 1 
                            "al_1" = 0.06310 # Attack thresh (-24.00 dB)
                            "cr_1" = 2.0     # Ratio
                            "at_1" = 150.0   # Attack time (ms)
                            "rt_1" = 2000.0  # Release time (ms)
                            "kn_1" = 0.35481 # Knee (-9.00 dB)
                            "mk_1" = 1.58489 # Makeup Gain (4.00 dB) was 2dB

                            # --- Band 3 (1250Hz - 5000Hz) ---
                            "ce_2" = 1 
                            "al_2" = 0.06310 # Attack thresh (-24.00 dB)
                            "cr_2" = 2.0     # Ratio
                            "at_2" = 100.0   # Attack time (ms)
                            "rt_2" = 1500.0  # Release time (ms)
                            "kn_2" = 0.35481 # Knee (-9.00 dB)
                            "mk_2" = 1.58489 # Makeup Gain (4.00 dB)

                            # --- Band 4 (5000Hz - 24000Hz) ---
                            "ce_3" = 1 
                            "al_3" = 0.06310 # Attack thresh (-24.00 dB)
                            "cr_3" = 2.5     # Ratio
                            "at_3" = 80.0    # Attack time (ms)
                            "rt_3" = 1200.0  # Release time (ms)
                            "kn_3" = 0.35481 # Knee (-9.00 dB)
                            "mk_3" = 1.58489 # Makeup Gain (4.00 dB)
                        }
                    }

                    # --- 8. 2-BAND CROSSOVER ---
                    {
                        type    = lv2
                        name    = crossover
                        plugin  = "http://lsp-plug.in/plugins/lv2/crossover_stereo"
                        control = {
                            "sf_1"  = 400.0  # Split Frequency (400Hz)
                            "frs_1" = 2      # Frequency Range Slope 2 (2 = LR4 24 dB/oct)
                            "frs_2" = 0
                            "frs_3" = 0
                            "frs_4" = 0
                            "frs_5" = 0
                            "frs_6" = 0
                            "frs_7" = 0
                        }
                    }

                    # --- 9a. FRONT LIMITERS (WOOFERS) ---
		            {
                        type    = lv2
                        name    = limiter_f
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {      
                            "alr" = 0 # Automatic Level Regulation: off
                            "at" = 2 # Attack time (ms) 
                            "rt" = 8 # Release time (ms)
                            "lk" = 4 # Lookahead (ms)
                            "ovs" = 6 # Oversampling Mode: 6 = "Half x4/24 bit"
                        }
                    }
                    
                    # --- 9b. REAR LIMITERS (TWEETERS) ---
		            {
                        type    = lv2
                        name    = limiter_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {      
                            "alr" = 0 # Automatic Level Regulation: off
                            "at" = 2 # Attack time (ms) 
                            "rt" = 8 # Release time (ms)
                            "lk" = 4 # Lookahead (ms)
                            "ovs" = 6 # Oversampling Mode: 6 = "Half x4/24 bit"       
                        }
                    }
                ]
                
                links = [
                    # Bass Exciter -> Loudness Compensator
                    { output = "bassex:out_l"       input = "ell:in_l" }
                    { output = "bassex:out_r"       input = "ell:in_r" }
                    
 	            # Loudness Compensator -> Convolver
                    { output = "ell:out_l"          input = "conv_l:In" }
                    { output = "ell:out_r"          input = "conv_r:In" }
                    
	            # Convolver -> Stereo Widener -> Voice EQ
                    { output = "conv_l:Out"         input = "stereo_tools:in_l" }
                    { output = "conv_r:Out"         input = "stereo_tools:in_r" }
                    { output = "stereo_tools:out_l" input = "post_eq:in_l" }
                    { output = "stereo_tools:out_r" input = "post_eq:in_r" }
                    
                    # Voice EQ -> Compressors
                    { output = "post_eq:out_l"      input = "sbc:in_l" }
                    { output = "post_eq:out_r"      input = "sbc:in_r" }
                    { output = "sbc:out_l"          input = "mbc:in_l" }
                    { output = "sbc:out_r"          input = "mbc:in_r" }

                    # Compressors -> Crossover Split
                    { output = "mbc:out_l"          input = "crossover:in_l" }
                    { output = "mbc:out_r"          input = "crossover:in_r" }
                      
                    # Highs (Band 1, >300Hz) to Rear Limiters
                    { output = "crossover:band1l"   input = "limiter_r:in_l" }
                    { output = "crossover:band1r"   input = "limiter_r:in_r" }

                    # Lows (Band 0, <300Hz) to Front Limiters
                    { output = "crossover:band0l"   input = "limiter_f:in_l" }
                    { output = "crossover:band0r"   input = "limiter_f:in_r" }
                ]

                inputs  = [ "bassex:in_l" "bassex:in_r" ]
                outputs = [ "limiter_f:out_l" "limiter_f:out_r" "limiter_r:out_l" "limiter_r:out_r" ]
            }
     
            capture.volumes = [
                {
                    control = "ell:volume"
                    min = -47.5
                    max = 0.0
                    scale = "cubic"
                }
            ]
            
            capture.props = {
                node.name = "audio_effect.movie_balanced_4ch"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                device.api = dsp
                node.virtual = false
                priority.session = 850
                device.icon-name = "audio-speakers"
            }
            
            playback.props = {
                node.name = "effect_output.movie_balanced_4ch"
                node.description = "Slim 7x Speakers DSP Out"
                media.name = "Slim 7x Speakers DSP Out"
                node.dont-fallback = true
                node.passive = true
                audio.channels = 4
                audio.position = [ FL FR RL RR ]
            }
        }
    }
]
