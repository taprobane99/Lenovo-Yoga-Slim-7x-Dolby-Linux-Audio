context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Dolby Atmos - Music (Balanced)"
            media.name       = "Dolby Atoms - Music (Balanced)"
            filter.graph = {
                nodes = [
                    # --- PRE-SPLIT BASS EXCITER ---
                    {
                        type    = lv2
                        name    = bassex
                        plugin  = "https://chadmed.au/bankstown"
                        control = { "bypass" = 0, "amt" = 1.5, "sat_second" = 1.3, "sat_third" = 2.5, "blend" = 1.0, "ceil" = 200.0, "floor" = 20.0 }
                    }

                    # --- PRE-SPLIT LOUDNESS COMPENSATORS (MONO) ---
                    {
                        type    = lv2
                        name    = loud_comp_l
                        plugin  = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        control = { "enabled" = 1, "input" = 1.0, "fft" = 2 }
                    }
                    {
                        type    = lv2
                        name    = loud_comp_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        control = { "enabled" = 1, "input" = 1.0, "fft" = 2 }
                    }

                    # --- PRE-SPLIT CONVOLVERS ---
                    { type = builtin name = conv_l label = convolver config = { filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.irs" channel = 0 } }
                    { type = builtin name = conv_r label = convolver config = { filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.irs" channel = 1 } }

                    # --- PRE-SPLIT STEREO PLUGINS ---
                    {
                        type    = lv2
                        name    = exciter
                        plugin  = "http://calf.sourceforge.net/plugins/Exciter"
                        control = { "level_in" = 0.7943, "amount" = 5.0, "drive" = 8.0, "freq" = 5500.0, "ceil" = 16000.0, "ceil_active" = 0, "blend" = 0.0 }
                    }
                    {
                        type    = lv2
                        name    = autogain
                        plugin  = "http://lsp-plug.in/plugins/lv2/autogain_stereo"
                        control = { "speriod" = 15.0, "silence" = -70.0, "level" = -14.0, "weight" = 5 }
                    }

                    # --- POST-SPLIT FRONT LIMITERS ---
                    {
                        type    = lv2
                        name    = limiter_f
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = { "enabled" = 1, "mode" = 0, "ovs" = 6, "dith" = 0, "extsc" = 0, "lk" = 1.0, "at" = 1.0, "rt" = 5.0, "th" = 0.89125, "boost" = 1, "slink" = 100.0, "alr" = 0, "scp" = 1.0 }
                    }

                    # --- POST-SPLIT REAR LIMITERS ---
                    {
                        type    = lv2
                        name    = limiter_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = { "enabled" = 1, "mode" = 0, "ovs" = 6, "dith" = 0, "extsc" = 0, "lk" = 1.0, "at" = 1.0, "rt" = 5.0, "th" = 0.89125, "boost" = 1, "slink" = 100.0, "alr" = 0, "scp" = 1.0 }
                    }
                ]
                
                links = [
                    # Pre-Split Stereo Chain
                    { output = "bassex:out_l"      input = "loud_comp_l:in" }
                    { output = "bassex:out_r"      input = "loud_comp_r:in" }
                    { output = "loud_comp_l:out"   input = "conv_l:In" }
                    { output = "loud_comp_r:out"   input = "conv_r:In" }
                    { output = "conv_l:Out"        input = "exciter:in_l" }
                    { output = "conv_r:Out"        input = "exciter:in_r" }
                    { output = "exciter:out_l"     input = "autogain:in_l" }
                    { output = "exciter:out_r"     input = "autogain:in_r" }
                    
                    # The Split (Stereo to 4-Channel Safety Limiters)
                    { output = "autogain:out_l"    input = "limiter_f:in_l" }
                    { output = "autogain:out_r"    input = "limiter_f:in_r" }
                    { output = "autogain:out_l"    input = "limiter_r:in_l" }
                    { output = "autogain:out_r"    input = "limiter_r:in_r" }
                ]

                inputs  = [ "bassex:in_l" "bassex:in_r" ]
                outputs = [ "limiter_f:out_l" "limiter_f:out_r" "limiter_r:out_l" "limiter_r:out_r" ]
                
                capture.volumes = [
                    {
                        control = "loud_comp_l:volume"
                        min = -47.5
                        max = 0.0
                        scale = "cubic"
                    }
                    {
                        control = "loud_comp_r:volume"
                        min = -47.5
                        max = 0.0
                        scale = "cubic"
                    }
                ]
            }
            
            capture.props = {
                node.name      = "effect_input.music_balanced_4ch"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                device.api = dsp
                node.virtual = false
                priority.session = 850
                state.default-volume = 0.343
            }
            
            playback.props = {
                node.name      = "effect_output.music_balanced_4ch"
                node.dont-fallback = true
                node.passive   = true
                audio.channels = 4
                audio.position = [ FL FR RL RR ]
            }
        }
    }
]
