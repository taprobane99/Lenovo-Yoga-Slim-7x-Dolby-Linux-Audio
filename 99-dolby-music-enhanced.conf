context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Dolby Atmos - Music (Balanced)"
            media.name       = "Dolby Atoms - Music (Balanced)"
            filter.graph = {
                nodes = [
                    # --- FRONT BASS EXCITERS ---
                    {
                        type    = lv2
                        name    = bassex_f
                        plugin  = "https://chadmed.au/bankstown"
                        control = { "bypass" = 0, "amt" = 1.5, "sat_second" = 1.3, "sat_third" = 2.5, "blend" = 1.0, "ceil" = 200.0, "floor" = 20.0 }
                    }

                    # --- REAR BASS EXCITERS ---
                    {
                        type    = lv2
                        name    = bassex_r
                        plugin  = "https://chadmed.au/bankstown"
                        control = { "bypass" = 0, "amt" = 1.5, "sat_second" = 1.3, "sat_third" = 2.5, "blend" = 1.0, "ceil" = 200.0, "floor" = 20.0 }
                    }

                    # --- FRONT LOUDNESS COMPENSATORS (MONO) ---
                    {
                        type    = lv2
                        name    = loud_comp_fl
                        plugin  = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        control = { "enabled" = 1, "input" = 1.0, "fft" = 2 }
                    }
                    {
                        type    = lv2
                        name    = loud_comp_fr
                        plugin  = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        control = { "enabled" = 1, "input" = 1.0, "fft" = 2 }
                    }

                    # --- REAR LOUDNESS COMPENSATORS (MONO) ---
                    {
                        type    = lv2
                        name    = loud_comp_rl
                        plugin  = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        control = { "enabled" = 1, "input" = 1.0, "fft" = 2 }
                    }
                    {
                        type    = lv2
                        name    = loud_comp_rr
                        plugin  = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                        control = { "enabled" = 1, "input" = 1.0, "fft" = 2 }
                    }

                    # --- FRONT CONVOLVERS ---
                    { type = builtin name = conv_fl label = convolver config = { filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.irs" channel = 0 } }
                    { type = builtin name = conv_fr label = convolver config = { filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.irs" channel = 1 } }
                    
                    # --- REAR CONVOLVERS ---
                    { type = builtin name = conv_rl label = convolver config = { filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.irs" channel = 0 } }
                    { type = builtin name = conv_rr label = convolver config = { filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.irs" channel = 1 } }

                    # --- FRONT STEREO PLUGINS ---
                    {
                        type    = lv2
                        name    = exciter_f
                        plugin  = "http://calf.sourceforge.net/plugins/Exciter"
                        control = { "level_in" = 0.7943, "amount" = 5.0, "drive" = 8.0, "freq" = 5500.0, "ceil" = 16000.0, "ceil_active" = 0, "blend" = 0.0 }
                    }
                    {
                        type    = lv2
                        name    = autogain_f
                        plugin  = "http://lsp-plug.in/plugins/lv2/autogain_stereo"
                        control = { "speriod" = 15.0, "silence" = -70.0, "level" = -14.0, "weight" = 5 }
                    }
                    {
                        type    = lv2
                        name    = limiter_f
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = { "mode" = 0, "ovs" = 6, "dith" = 0, "extsc" = 0, "lk" = 1.0, "at" = 1.0, "rt" = 5.0, "th" = 0.89125, "boost" = 1, "slink" = 100.0, "alr" = 0, "scp" = 1.0 }
                    }

                    # --- REAR STEREO PLUGINS ---
                    {
                        type    = lv2
                        name    = exciter_r
                        plugin  = "http://calf.sourceforge.net/plugins/Exciter"
                        control = { "level_in" = 0.7943, "amount" = 5.0, "drive" = 8.0, "freq" = 5500.0, "ceil" = 16000.0, "ceil_active" = 0, "blend" = 0.0 }
                    }
                    {
                        type    = lv2
                        name    = autogain_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/autogain_stereo"
                        control = { "speriod" = 15.0 , "silence" = -70.0, "level" = -14.0, "weight" = 5 }
                    }
                    {
                        type    = lv2
                        name    = limiter_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = { "mode" = 0, "ovs" = 6, "dith" = 0, "extsc" = 0, "lk" = 1.0, "at" = 1.0, "rt" = 5.0, "th" = 0.89125, "boost" = 1, "slink" = 100.0, "alr" = 0, "scp" = 1.0 }
                    }
                ]
                
                links = [
                    # Front Chain
                    { output = "bassex_f:out_l"   input = "loud_comp_fl:in" }
                    { output = "bassex_f:out_r"   input = "loud_comp_fr:in" }
                    { output = "loud_comp_fl:out" input = "conv_fl:In" }
                    { output = "loud_comp_fr:out" input = "conv_fr:In" }
                    { output = "conv_fl:Out"      input = "exciter_f:in_l" }
                    { output = "conv_fr:Out"      input = "exciter_f:in_r" }
                    { output = "exciter_f:out_l"  input = "autogain_f:in_l" }
                    { output = "exciter_f:out_r"  input = "autogain_f:in_r" }
                    { output = "autogain_f:out_l" input = "limiter_f:in_l" }
                    { output = "autogain_f:out_r" input = "limiter_f:in_r" }
                    
                    # Rear Chain
                    { output = "bassex_r:out_l"   input = "loud_comp_rl:in" }
                    { output = "bassex_r:out_r"   input = "loud_comp_rr:in" }
                    { output = "loud_comp_rl:out" input = "conv_rl:In" }
                    { output = "loud_comp_rr:out" input = "conv_rr:In" }
                    { output = "conv_rl:Out"      input = "exciter_r:in_l" }
                    { output = "conv_rr:Out"      input = "exciter_r:in_r" }
                    { output = "exciter_r:out_l"  input = "autogain_r:in_l" }
                    { output = "exciter_r:out_r"  input = "autogain_r:in_r" }
                    { output = "autogain_r:out_l" input = "limiter_r:in_l" }
                    { output = "autogain_r:out_r" input = "limiter_r:in_r" }
                ]

                inputs  = [ "bassex_f:in_l" "bassex_f:in_r" "bassex_r:in_l" "bassex_r:in_r" ]
                outputs = [ "limiter_f:out_l" "limiter_f:out_r" "limiter_r:out_l" "limiter_r:out_r" ]
            }
            
            capture.props = {
                node.name      = "effect_input.music_balanced_4ch"
                media.class    = Audio/Sink
                audio.channels = 4
                audio.position = [ FL FR RL RR ]
                device.api = dsp
                node.virtual = false
                priority.session = 850
                state.default-volume = 0.343
            }
            
            playback.props = {
                node.name      = "effect_output.music_balanced_4ch"
                node.dont-fallback = true
                node.passive   = true
                audio.channels = 4
                audio.position = [ FL FR RL RR ]
            }
        }
    }
]
