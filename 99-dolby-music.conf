context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Dolby Atmos - Music (Balanced)"
            media.name       = "Dolby Atmos - Music (Balanced)"
            filter.graph = {
                nodes = [
                    # --- 1. BASS EXCITER ---
                    {
                        type    = lv2
                        name    = bassex
                        plugin  = "https://chadmed.au/bankstown"
                        control = {
                            "bypass" = 0
                            "amt" = 1.2
                            "sat_second" = 1.5
                            "sat_third" = 2.5
                            "blend" = 1.0
                            "ceil" = 200.0
                            "floor" = 20.0
                            "final_hp" = 130.0
                        }
                    }
                    
                    # --- 2. LOUDNESS COMPRESSOR ---
                    {
                        type   = lv2
                        name   = ell
                        plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_stereo"
                        control = {
                            "enabled" = 1
                            "input" = 1.0
                            "fft" = 2
                        }
                    }

                    # --- 3. CONVOLVER ---
                    {
                        type = builtin
                        name = conv_l
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.wav"
                            channel = 0
                        }
                    }
                    {
                        type = builtin
                        name = conv_r
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.wav"
                            channel = 1
                        }
                    }

                    # --- 4. MULTIBAND COMPRESSORS ---
                    {
                        type    = lv2
                        name    = mbc0
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            # --- GLOBAL SETTINGS ---
                            "mode" = 1          # 1 = Modern Compressor Mode
                            "envb" = 0          # Envelope Boost: off
                            
                            # --- BAND SPLITS ---
                            "cbe_1" = 1         # Enable Split 1
                            "sf_1" = 469.0      # Split 1 Frequency (Hz)
                            
                            # --- BAND 0 (Lows) ---
                            "ce_0" = 1          # Compressor Enable
                            "al_0" = 0.56234    # Attack Threshold (-5.0 dB)
                            "at_0" = 0.9        # Attack Time (ms)
                            "rrl_0" = 0.0001    # Release Threshold (-80.01 dB)
                            "rt_0" = 1.0        # Release Time (ms)
                            "cr_0" = 3.94       # Ratio
                            "kn_0" = 0.50119    # Knee (-6.0 dB)
                            "mk_0" = 1.25893    # Makeup Gain (+2.0 dB)
                            "scm_0" = 1         # Sidechain Mode (1 = RMS)
                            "sla_0" = 0.0       # Sidechain Lookahead
                            "scr_0" = 10.0      # Sidechain Reactivity
                            "scp_0" = 1.0       # Sidechain Preamp (0.0 dB)
                            
                            # --- BAND 1 (Highs) ---
                            "ce_1" = 1          # Compressor Enable
                            "al_1" = 0.60256    # Attack Threshold (-4.4 dB)
                            "at_1" = 0.8        # Attack Time (ms)
                            "rrl_1" = 0.0001    # Release Threshold (-80.01 dB)
                            "rt_1" = 0.9        # Release Time (ms)
                            "cr_1" = 4.0        # Ratio
                            "kn_1" = 0.50119    # Knee (-6.0 dB)
                            "mk_1" = 1.18850    # Makeup Gain (+1.5 dB)
                            "scm_1" = 1         # Sidechain Mode (1 = RMS)
                            "sla_1" = 0.0       # Sidechain Lookahead
                            "scr_1" = 10.0      # Sidechain Reactivity
                            "scp_1" = 1.0       # Sidechain Preamp (0.0 dB)
                        }
                    }
                    {
                        type    = lv2
                        name    = mbc1
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            # --- GLOBAL SETTINGS ---
                            "mode" = 1          # 1 = Modern Compressor Mode
                            "envb" = 0          # Envelope Boost: off
                            
                            # --- BAND SPLITS ---
                            "cbe_1" = 1         # Enable Split 1
                            "sf_1" = 81.4       # Split 1 Frequency (Hz)
                            "cbe_2" = 1         # Enable Split 2
                            "sf_2" = 181.6      # Split 2 Frequency (Hz)
                            "cbe_3" = 1         # Enable Split 3
                            "sf_3" = 277.0      # Split 3 Frequency (Hz)
                            "cbe_4" = 1         # Enable Split 4
                            "sf_4" = 392.2      # Split 4 Frequency (Hz)
                            "cbe_5" = 1         # Enable Split 5
                            "sf_5" = 554.7      # Split 5 Frequency (Hz)
                            "cbe_6" = 1         # Enable Split 6
                            "sf_6" = 744.1      # Split 6 Frequency (Hz)
                            
                            # --- BAND 0 ---
                            "ce_0" = 1          # Compressor Enable
                            "al_0" = 0.49545    # Attack Threshold (-6.1 dB)
                            "at_0" = 1.0        # Attack Time (ms)
                            "rrl_0" = 0.0001    # Release Threshold (-80.01 dB)
                            "rt_0" = 50.0       # Release Time (ms)
                            "cr_0" = 100.0      # Ratio
                            "kn_0" = 0.59566    # Knee (-4.5 dB)
                            "mk_0" = 1.0        # Makeup Gain (0.0 dB)
                            "scm_0" = 0         # Sidechain Mode (0 = Peak)
                            "sla_0" = 1.0       # Sidechain Lookahead
                            
                            # --- BAND 1 ---
                            "ce_1" = 1
                            "al_1" = 0.35892    # Attack Threshold (-8.9 dB)
                            "at_1" = 1.0
                            "rrl_1" = 0.0001
                            "rt_1" = 50.0
                            "cr_1" = 100.0
                            "kn_1" = 0.59566    # Knee (-4.5 dB)
                            "mk_1" = 1.0
                            "scm_1" = 0         # Sidechain Mode (0 = Peak)
                            "sla_1" = 1.0
                            
                            # --- BAND 2 ---
                            "ce_2" = 1
                            "al_2" = 0.26303    # Attack Threshold (-11.6 dB)
                            "at_2" = 1.0
                            "rrl_2" = 0.0001
                            "rt_2" = 50.0
                            "cr_2" = 100.0
                            "kn_2" = 0.59566    # Knee (-4.5 dB)
                            "mk_2" = 1.0
                            "scm_2" = 0         # Sidechain Mode (0 = Peak)
                            "sla_2" = 1.0
                            
                            # --- BAND 3 ---
                            "ce_3" = 1
                            "al_3" = 0.29854    # Attack Threshold (-10.5 dB)
                            "at_3" = 1.0
                            "rrl_3" = 0.0001
                            "rt_3" = 50.0
                            "cr_3" = 100.0
                            "kn_3" = 0.59566    # Knee (-4.5 dB)
                            "mk_3" = 1.0
                            "scm_3" = 0         # Sidechain Mode (0 = Peak)
                            "sla_3" = 1.0
                            
                            # --- BAND 4 ---
                            "ce_4" = 1
                            "al_4" = 0.40272    # Attack Threshold (-7.9 dB)
                            "at_4" = 1.0
                            "rrl_4" = 0.0001
                            "rt_4" = 50.0
                            "cr_4" = 100.0
                            "kn_4" = 0.59566    # Knee (-4.5 dB)
                            "mk_4" = 1.0
                            "scm_4" = 0         # Sidechain Mode (0 = Peak)
                            "sla_4" = 1.0
                            
                            # --- BAND 5 ---
                            "ce_5" = 1
                            "al_5" = 0.47863    # Attack Threshold (-6.4 dB)
                            "at_5" = 1.0
                            "rrl_5" = 0.0001
                            "rt_5" = 50.0
                            "cr_5" = 100.0
                            "kn_5" = 0.59566    # Knee (-4.5 dB)
                            "mk_5" = 1.0
                            "scm_5" = 0         # Sidechain Mode (0 = Peak)
                            "sla_5" = 1.0
                        }
                    }

                    # --- 5. 2-BAND CROSSOVER ---
                    {
                        type    = lv2
                        name    = crossover
                        plugin  = "http://lsp-plug.in/plugins/lv2/crossover_stereo"
                        control = {
                            "sf_1"  = 400.0  # Split Frequency (400Hz)
                            "frs_1" = 2      # Frequency Range Slope 2 (2 = LR4 24 dB/oct)
                            "frs_2" = 0
                            "frs_3" = 0
                            "frs_4" = 0
                            "frs_5" = 0
                            "frs_6" = 0
                            "frs_7" = 0
                        }
                    }

                    # --- 6a. FRONT LIMITERS (WOOFERS) ---
		    {
                        type    = lv2
                        name    = limiter_f
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {      
                            "lk"      = 1.0     # lookahead: 1.0 ms
                            "at"      = 1.0     # attack: 1.0 ms
                            "rt"      = 5.0     # release: 5.0 ms
                            "th"      = 0.89125 # threshold: -1.0 dB
                        }
                    }
                    
                    # --- 6b. REAR LIMITERS (TWEETERS) ---
		    {
                        type    = lv2
                        name    = limiter_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {      
                            "lk"      = 1.0     # lookahead: 1.0 ms
                            "at"      = 1.0     # attack: 1.0 ms
                            "rt"      = 5.0     # release: 5.0 ms
                            "th"      = 0.89125 # threshold: -1.0 dB
                        }
                    }
                ]
                
                links = [
                    # Bass Exciter -> Loudness Compressor -> Convolvers
                    { output = "bassex:out_l"      input = "ell:in_l" }
                    { output = "bassex:out_r"      input = "ell:in_r" }
                    { output = "ell:out_l"         input = "conv_l:In" }
                    { output = "ell:out_r"         input = "conv_r:In" }
                    
                    # Convolvers -> Multiband Compressors
                    { output = "conv_l:Out"        input = "mbc0:in_l" }
                    { output = "conv_r:Out"        input = "mbc0:in_r" }
                    { output = "mbc0:out_l"        input = "mbc1:in_l" }
                    { output = "mbc0:out_r"        input = "mbc1:in_r" }
                    
                    # Multiband Compressors -> Crossover Split
                    { output = "mbc1:out_l"        input = "crossover:in_l" }
                    { output = "mbc1:out_r"        input = "crossover:in_r" }
                    
                    # Highs (Band 1, >300Hz) to Rear Limiters
                    { output = "crossover:band1l"  input = "limiter_r:in_l" }
                    { output = "crossover:band1r"  input = "limiter_r:in_r" }

                    # Lows (Band 0, <300Hz) to Front Limiters
                    { output = "crossover:band0l"  input = "limiter_f:in_l" }
                    { output = "crossover:band0r"  input = "limiter_f:in_r" }
                ]

                inputs  = [ "bassex:in_l" "bassex:in_r" ]
                outputs = [ "limiter_f:out_l" "limiter_f:out_r" "limiter_r:out_l" "limiter_r:out_r" ]
            }
     
            capture.volumes = [
                {
                    control = "ell:volume"
                    min = -47.5
                    max = 0.0
                    scale = "cubic"
                }
            ]
            
            capture.props = {
                node.name = "audio_effect.music_balanced_4ch"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                device.api = dsp
                node.virtual = false
                priority.session = 850
                #state.default-volume = 0.5
                device.icon-name = "audio-speakers"
            }
            
            playback.props = {
                node.name = "effect_output.music_balanced_4ch"
                node.description = "Slim 7x Speakers DSP Out"
                media.name = "Slim 7x Speakers DSP Out"
                #target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
                node.dont-fallback = true
                node.passive = true
                audio.channels = 4
                audio.position = [ FL FR RL RR ]
            }
        }
    }
]
