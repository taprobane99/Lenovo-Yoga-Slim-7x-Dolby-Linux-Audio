context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Dolby Atmos - Music"
            media.name       = "Dolby Atmos - Music"
            filter.graph = {
                nodes = [
                    # --- 1. BASS EXCITER & HIGH PASS FILTER --- 
                    {
                        type    = lv2
                        name    = bassex
                        plugin  = "https://chadmed.au/bankstown"
                        control = {
                            "bypass" = 0 # 0 = use this filter, 1 = bypass this filter
                            "amt" = 1.2 # increase to 1.3, 1.4 or 1.5 for more bass enhance
                            "sat_second" = 1.3
                            "sat_third" = 2.5
                            "blend" = 1.0
                            "ceil" = 200.0
                            "floor" = 20.0
                            "final_hp" = 130.0
                        }
                    }
                    
                    # --- 2. LOUDNESS COMPENSATOR --- makes audio sound better at low volumes
                    {
                        type   = lv2
                        name   = ell
                        plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_stereo"
                        control = {
                            "input" = 1.0
                            "fft" = 2
                        }
                    }

                    # --- 3. CONVOLVER (FROM DOLBY TUNING) --- converted from EQ bands to impulse using RePhase
                    {
                        type = builtin
                        name = conv_l
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.wav"
                            channel = 0
                        }
                    }
                    {
                        type = builtin
                        name = conv_r
                        label = convolver
                        config = {
                            filename = "/usr/share/dolby-audio/Dolby-Music-Balanced.wav"
                            channel = 1
                        }
                    }
                    
                    # --- 4. FAST GLOBAL COMPRESSOR --- prevents fast peaks from clipping
                    {
                        type    = lv2
                        name    = sbc
                        plugin  = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                        control = {
                            "bypass" = 0
                            "g_in"  = 0.3162 # -10dB
                            "al"    = 0.3162 # -10dB
                            "cr"    = 8     
                            "at"    = 5    
                            "rt"    = 50   
                            "kn"    = 0.5012 # -6dB
                        }
                    }

                    # --- 5. SLOW 4 BAND COMPRESSOR --- gently shapes audio in bands with low compression ratios
                    # note - typ. bands 100/400/2000/16000Hz bass/mid/high
                    # dB gain values - 1.12589 (1dB), 1.25893 (2dB), 1.41254 (3dB), 1.58489 (4dB), 1.77828 (5dB), 1.99526 (6dB)
                    {
                        type    = lv2
                        name    = mbc
                        plugin  = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            "bypass" = 0
                            # --- GLOBAL SETTINGS ---
                            "envb" = 0 # Envelope Boost: off
			    # --- SPLIT FREQUENCIES ---
                            "cbe_1" = 1 # Split Band 0 and 1
                            "sf_1" = 250.0 
                            "cbe_2" = 1 # Split Band 1 and 2
                            "sf_2" = 1250.0 
                            "cbe_3" = 1 # Split Band 2 and 3
                            "sf_3" = 5000.0 
                            
                            # --- Band 1 (0Hz - 250Hz) --- Bass
                            "ce_0" = 1 
                            "al_0" = 0.15849 # Attack thresh (-16.00 dB)
                            "cr_0" = 3.0     # Ratio
                            "at_0" = 150.0   # Attack time (ms)
                            "rt_0" = 3000.0  # Release time (ms)
                            "kn_0" = 0.25119 # Knee (-12.00 dB)
                            "mk_0" = 1.58489 # Makeup Gain (4.00 dB) - higher dB is louder
                            
                            # --- Band 2 (250Hz - 1250Hz) --- Bass-Mid
                            "ce_1" = 1 
                            "al_1" = 0.06310 # Attack thresh (-24.00 dB)
                            "cr_1" = 2.0     # Ratio
                            "at_1" = 150.0   # Attack time (ms)
                            "rt_1" = 2000.0  # Release time (ms)
                            "kn_1" = 0.35481 # Knee (-9.00 dB)
                            "mk_1" = 1.58489 # Makeup Gain (4.00 dB)

                            # --- Band 3 (1250Hz - 5000Hz) --- Mid-High
                            "ce_2" = 1 
                            "al_2" = 0.06310 # Attack thresh (-24.00 dB)
                            "cr_2" = 2.0     # Ratio
                            "at_2" = 100.0   # Attack time (ms)
                            "rt_2" = 1500.0  # Release time (ms)
                            "kn_2" = 0.35481 # Knee (-9.00 dB)
                            "mk_2" = 1.58489 # Makeup Gain (4.00 dB)

                            # --- Band 4 (5000Hz - 24000Hz) --- Highs
                            "ce_3" = 1 
                            "al_3" = 0.06310 # Attack thresh (-24.00 dB)
                            "cr_3" = 2.5     # Ratio
                            "at_3" = 80.0    # Attack time (ms)
                            "rt_3" = 1200.0  # Release time (ms)
                            "kn_3" = 0.35481 # Knee (-9.00 dB)
                            "mk_3" = 1.58489 # Makeup Gain (4.00 dB)
                        }
                    }

                    # --- 6. 2-BAND CROSSOVER --- sends bass to down-firing woofers, Linkwitz-Riley LR4
                    {
                        type    = lv2
                        name    = crossover
                        plugin  = "http://lsp-plug.in/plugins/lv2/crossover_stereo"
                        control = {
                            "bypass" = 0
                            "sf_1"  = 400.0  # Split Frequency (400Hz)
                            "frs_1" = 2      # Frequency Range Slope 2 (2 = LR4 24 dB/oct)
                            "frs_2" = 0
                            "frs_3" = 0
                            "frs_4" = 0
                            "frs_5" = 0
                            "frs_6" = 0
                            "frs_7" = 0
                        }
                    }

                    # --- 7a. FRONT LIMITERS (WOOFERS) --- stops audio going above 0dB
		            {
                        type    = lv2
                        name    = limiter_f
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {      
                            "alr" = 0 # Automatic Level Regulation: off
                            "at" = 2 # Attack time (ms) 
                            "rt" = 8 # Release time (ms)
                            "lk" = 4 # Lookahead (ms)
                            "ovs" = 6 # Oversampling Mode: 6 = "Half x4/24 bit"
                        }
                    }
                    
                    # --- 7b. REAR LIMITERS (TWEETERS) --- stops audio going above 0dB
		            {
                        type    = lv2
                        name    = limiter_r
                        plugin  = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {      
                            "alr" = 0 # Automatic Level Regulation: off
                            "at" = 2 # Attack time (ms) 
                            "rt" = 8 # Release time (ms)
                            "lk" = 4 # Lookahead (ms)
                            "ovs" = 6 # Oversampling Mode: 6 = "Half x4/24 bit"       
                        }
                    }
                ]
                
                links = [
                    # Bass Exciter -> Loudness Compensator
                    { output = "bassex:out_l"      input = "ell:in_l" }
                    { output = "bassex:out_r"      input = "ell:in_r" }
                    
 	            # Loudness Compensator -> Convolver
                    { output = "ell:out_l"         input = "conv_l:In" }
                    { output = "ell:out_r"         input = "conv_r:In" }

                    # Convolver -> Compressors
                    { output = "conv_l:Out"        input = "sbc:in_l" }
                    { output = "conv_r:Out"        input = "sbc:in_r" }
                    { output = "sbc:out_l"         input = "mbc:in_l" }
                    { output = "sbc:out_r"         input = "mbc:in_r" }

                    # Compressors -> Crossover Split
                    { output = "mbc:out_l"         input = "crossover:in_l" }
                    { output = "mbc:out_r"         input = "crossover:in_r" }
                    
                    # Highs (Band 1, >400Hz) to Rear Limiters
                    { output = "crossover:band1l"  input = "limiter_r:in_l" }
                    { output = "crossover:band1r"  input = "limiter_r:in_r" }

                    # Lows (Band 0, <400Hz) to Front Limiters
                    { output = "crossover:band0l"  input = "limiter_f:in_l" }
                    { output = "crossover:band0r"  input = "limiter_f:in_r" }
                ]

                inputs  = [ "bassex:in_l" "bassex:in_r" ]
                outputs = [ "limiter_f:out_l" "limiter_f:out_r" "limiter_r:out_l" "limiter_r:out_r" ]
            }
     
            capture.volumes = [
                {
                    control = "ell:volume"
                    min = -47.5
                    max = 0.0
                    scale = "cubic"
                }
            ]
            
            capture.props = {
                node.name = "audio_effect.music_balanced_4ch"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                device.api = dsp
                node.virtual = false
                priority.session = 850
                device.icon-name = "audio-speakers"
            }
            
            playback.props = {
                node.name = "effect_output.music_balanced_4ch"
                node.description = "Slim 7x Speakers DSP Out"
                media.name = "Slim 7x Speakers DSP Out"
                node.dont-fallback = true
                node.passive = true
                audio.channels = 4
                audio.position = [ FL FR RL RR ]
            }
        }
    }
]
